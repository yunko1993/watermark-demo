server.address=127.0.0.1
server.port=${SERVER_PORT:8088}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.config.import=optional:file:./application-local.properties
minio.endpoint=${MINIO_ENDPOINT:http://127.0.0.1:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:watermark-demo}
libreoffice.executable=${LIBREOFFICE_EXECUTABLE:C:/Program Files/LibreOffice/program/soffice.com}
libreoffice.timeout-seconds=${LIBREOFFICE_TIMEOUT_SECONDS:90}
